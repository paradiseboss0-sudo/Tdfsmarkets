<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TDFS Client</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#0a0a0a;color:white;font-family:Arial;padding:20px;text-align:center}h1{color:#00ff88}.card{background:#1a1a1a;padding:20px;border-radius:12px;max-width:400px;margin:20px auto;border:1px solid #333}button{background:#00ff88;color:black;padding:12px 24px;border:none;border-radius:8px;font-weight:bold;width:100%;margin-top:10px}</style></head><body><h1>TDFS MARKETS</h1><div class=card><h3 id=bal>Balance: $0</h3><p id=email>Loading...</p><input id=amt type=number placeholder=Amount style="padding:10px;width:90%;border-radius:6px;background:#222;color:white;border:1px solid #555"><button onclick=dep()>Deposit</button><button onclick=wit()>Withdraw</button><button onclick=logout()>Logout</button></div><script>let url=localStorage.getItem('sb_url');let key=localStorage.getItem('sb_key');if(!url){url=prompt('PASTE YOUR SUPABASE URL:\nExample: https://xxxx.supabase.co');key=prompt('PASTE YOUR SUPABASE ANON KEY:\nStarts with eyJ...');localStorage.setItem('sb_url',url);localStorage.setItem('sb_key',key);}const supabaseClient=supabase.createClient(url,key);let user=null;async function init(){const {data}=await supabaseClient.auth.getSession();if(!data.session){window.location='index.html';return;}user=data.session.user;document.getElementById('email').innerText=user.email;const {data:p}=await supabaseClient.from('profiles').select('balance').eq('id',user.id).single();if(p)document.getElementById('bal').innerText='Balance: $'+p.balance;}async function dep(){let a=document.getElementById('amt').value;await supabaseClient.from('transactions').insert({user_id:user.id,type:'deposit',amount:parseFloat(a),status:'pending'});alert('Deposit request sent!');}async function wit(){let a=document.getElementById('amt').value;await supabaseClient.from('transactions').insert({user_id:user.id,type:'withdrawal',amount:parseFloat(a),status:'pending'});alert('Withdrawal request sent!');}function logout(){supabaseClient.auth.signOut();localStorage.clear();window.location='index.html';}init();</script></body></html>

<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{background:#0a0a0a;color:white;font-family:sans-serif;padding:20px} .card{background:#151515;padding:20px;border-radius:12px;margin:10px 0} button{padding:10px;background:#00ff88;border:none;border-radius:8px;font-weight:bold}</style>
</head><body><h2>Client Dashboard</h2>
<div class="card">Balance: $<span id="bal">0</span><br>Invested: $<span id="inv">0</span></div>
<div class="card"><input id="amt" placeholder="Amount to invest"><button onclick="invest()">Invest Now</button></div>
<div class="card"><input id="wamt" placeholder="Withdraw amount"><button onclick="withdraw()">Request Withdraw</button></div>
<div class="card" id="history"></div>
<script>
const supabaseClient = supabase.createClient('https://dtuxgsuuvfzunjavogts.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0dXhnc3V1dmZ6dW5qYXZvZ3RzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MjM3MDcsImV4cCI6MjEwNzQ5OTcwN30.Pqwbg8Dl6gy0jXUoKsFSuQUgMqxZdKrPZTeP5ETtR7Y')
let userId;
async function load(){
 const {data:{user}}=await supabaseClient.auth.getUser(); if(!user){location.href='login.html';return} userId=user.id;
 const {data}=await supabaseClient.from('profiles').select('*').eq('id',userId).single();
 document.getElementById('bal').innerText=data.balance; document.getElementById('inv').innerText=data.total_invested;
 const {data:tx}=await supabaseClient.from('transactions').select('*').eq('user_id',userId).order('created_at',{ascending:false});
 document.getElementById('history').innerHTML=tx.map(t=>`${t.type} - $${t.amount} - ${t.status}<br>`).join('')
}
async function invest(){
 const amount=parseFloat(document.getElementById('amt').value);
 await supabaseClient.from('investments').insert({user_id:userId,amount,plan:'TDFS Plan'});
 await supabaseClient.from('transactions').insert({user_id:userId,type:'invest',amount,status:'active'});
 alert('Investment added! Admin sees it LIVE!'); load();
}
async function withdraw(){
 const amount=parseFloat(document.getElementById('wamt').value);
 await supabaseClient.from('transactions').insert({user_id:userId,type:'withdraw',amount,status:'pending'});
 alert('Withdraw request sent to admin!'); load();
}
load();
supabaseClient.channel('realtime').on('postgres_changes',{event:'*',schema:'public',table:'profiles'},load).subscribe();
</script></body></html>

<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TDFS Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#0a0a0a;color:white;font-family:Arial;padding:12px}h2{color:#00ff88;border-bottom:2px solid #00ff88;padding-bottom:8px}.card{background:#1a1a1a;padding:12px;margin:12px 0;border-radius:10px;border:1px solid #333}.green{background:#00ff88;color:black;padding:7px 12px;border:none;border-radius:6px;font-weight:bold}input{padding:7px;border-radius:5px;background:#222;color:white;border:1px solid #555}.row{padding:10px;border-bottom:1px solid #333}</style></head><body><h2>ADMIN - TDFS LIVE</h2><button class=green onclick="localStorage.clear();location.reload()">Reset Link</button><div class=card><h3>Clients</h3><div id=clients>Loading...</div></div><div class=card><h3>Transactions</h3><div id=txs>Loading...</div></div><script>let url=localStorage.getItem('sb_url');let key=localStorage.getItem('sb_key');if(!url){url=prompt('PASTE YOUR SUPABASE URL:\nExample: https://xxxx.supabase.co');key=prompt('PASTE YOUR SUPABASE ANON KEY:\nStarts with eyJ...');localStorage.setItem('sb_url',url);localStorage.setItem('sb_key',key);}const supabaseClient=supabase.createClient(url,key);async function load(){const {data:c}=await supabaseClient.from('profiles').select('*');document.getElementById('clients').innerHTML=c?c.map(x=>`<div class=row>${x.email||x.id} - $${x.balance||0} <input id=b-${x.id} placeholder=$ style=width:60px><button class=green onclick=upd('${x.id}')>Update</button></div>`).join(''):'No clients yet';const {data:t}=await supabaseClient.from('transactions').select('*').order('created_at',{ascending:false});document.getElementById('txs').innerHTML=t?t.map(x=>`<div class=row>${x.type} $${x.amount} - ${x.status} <button class=green onclick=ap('${x.id}')>Approve</button></div>`).join(''):'No transactions';}async function upd(id){let v=document.getElementById('b-'+id).value;await supabaseClient.from('profiles').update({balance:parseFloat(v)}).eq('id',id);load();}async function ap(id){await supabaseClient.from('transactions').update({status:'approved'}).eq('id',id);load();}load();</script></body></html>

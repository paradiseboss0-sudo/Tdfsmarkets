<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{background:#0a0a0a;color:white;font-family:Arial;padding:15px}h2{color:#00ff88}.card{background:#1a1a1a;padding:15px;margin:15px 0;border-radius:10px;border:1px solid #333}.green{background:#00ff88;color:#000;padding:8px 12px;border:none;border-radius:5px;margin:2px;font-weight:bold}.red{background:#ff4444;color:white;padding:8px 12px;border:none;border-radius:5px;margin:2px}input{padding:7px;border-radius:5px;background:#222;color:white;border:1px solid #444}</style>
</head><body>
<h2>ADMIN - TDFS MARKETS (LIVE)</h2>
<div class="card"><h3>Clients</h3><div id="clients">Loading...</div></div>
<div class="card"><h3>All Transactions</h3><div id="txs">Loading...</div></div>
<script>
const supabaseUrl = 'REPLACE_WITH_YOUR_SUPABASE_URL';
const supabaseKey = 'REPLACE_WITH_YOUR_ANON_KEY';
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
async function load(){
 const {data:clients}=await supabaseClient.from('profiles').select('*');
 document.getElementById('clients').innerHTML=clients?.length?clients.map(c=>`<div>${c.email||c.id} - $${c.balance||0} <input id="b-${c.id}" placeholder="New balance"> <button class=green onclick="updateBal('${c.id}')">Update</button> <button class=green onclick="makeAdmin('${c.id}')">Make Admin</button></div>`).join(''):'No clients yet';
 const {data:txs}=await supabaseClient.from('transactions').select('*');
 document.getElementById('txs').innerHTML=txs?.length?txs.map(t=>`<div>${t.user_id||''} - ${t.type} $${t.amount} - ${t.status} <button class=green onclick="approve('${t.id}')">Approve</button><button class=red onclick="reject('${t.id}')">Reject</button></div>`).join(''):'No transactions yet';
}
async function updateBal(id){const v=document.getElementById('b-'+id).value;await supabaseClient.from('profiles').update({balance:v}).eq('id',id);load();}
async function makeAdmin(id){await supabaseClient.from('profiles').update({is_admin:true}).eq('id',id);load();}
async function approve(id){await supabaseClient.from('transactions').update({status:'approved'}).eq('id',id);load();}
async function reject(id){await supabaseClient.from('transactions').update({status:'rejected'}).eq('id',id);load();}
load();
supabaseClient.channel('admin-live').on('postgres_changes',{event:'*',schema:'public',table:'profiles'},load).on('postgres_changes',{event:'*',schema:'public',table:'transactions'},load).subscribe();
</script></body></html>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{background:#0a0a0a;color:white;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh} .box{background:#151515;padding:30px;border-radius:15px;width:90%;max-width:380px} input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none} button{width:100%;padding:12px;background:#00ff88;color:black;font-weight:bold;border:none;border-radius:8px;margin-top:10px}</style>
</head><body>
<div class="box"><h2>TDFS MARKETS</h2>
<input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password">
<button onclick="signup()">Sign Up</button><button onclick="login()" style="background:white">Login</button><p id="msg"></p></div>
<script>
const supabaseClient = supabase.createClient('https://dtuxgsuuvfzunjavogts.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0dXhnc3V1dmZ6dW5qYXZvZ3RzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MjM3MDcsImV4cCI6MjEwNzQ5OTcwN30.Pqwbg8Dl6gy0jXUoKsFSuQUgMqxZdKrPZTeP5ETtR7Y')
async function signup(){
 const email=document.getElementById('email').value; const password=document.getElementById('password').value;
 const {data,error}=await supabaseClient.auth.signUp({email,password});
 if(error){document.getElementById('msg').innerText=error.message;return}
 await supabaseClient.from('profiles').insert({id:data.user.id,email,role:'client',balance:0});
 document.getElementById('msg').innerText='Account created! Now Login';
}
async function login(){
 const email=document.getElementById('email').value; const password=document.getElementById('password').value;
 const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
 if(error){document.getElementById('msg').innerText=error.message;return}
 const {data:profile}=await supabaseClient.from('profiles').select('*').eq('id',data.user.id).single();
 if(profile.role==='admin'){location.href='admin.html'}else{location.href='client.html'}
}
</script></body></html>
